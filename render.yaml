services:
  # ---------------------------------------------------
  # KrishiDirect Express + Node.js API Service
  # ---------------------------------------------------
  - type: web
    name: krishidirect-api
    env: node
    plan: free
    buildCommand: npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: krishidirect-web
          property: host
      - key: API_BASE_URL
        value: https://krishidirect-api.onrender.com

  # ---------------------------------------------------
  # KrishiDirect React + Vite SPA Static Web Site
  # ---------------------------------------------------
  - type: web
    name: krishidirect-web
    env: static
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api-docs*
        destination: https://krishidirect-api.onrender.com/api-docs*
      - type: rewrite
        source: /docs*
        destination: https://krishidirect-api.onrender.com/api-docs*
      - type: rewrite
        source: /api/*
        destination: https://krishidirect-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://krishidirect-api.onrender.com
